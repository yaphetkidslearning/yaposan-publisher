services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yaposan
      POSTGRES_USER: yaposan
      POSTGRES_PASSWORD: yaposan
    ports: ["5432:5432"]
    volumes: ["yaposan_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yaposan -d yaposan"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    image: node:22-alpine
    working_dir: /app
    command: ["npm", "run", "server"]
    env_file: .env
    volumes: [".:/app"]
    ports: ["4100:4100"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  yaposan_postgres:
