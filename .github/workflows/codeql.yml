name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  analyze:
    # CodeQL code scanning requires GitHub Code Security for private repositories.
    # Run automatically when the repository is public.
    if: github.event.repository.visibility == 'public'

    runs-on: ubuntu-latest

    strategy:
      matrix:
        language:
          - javascript-typescript

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Analyze
        uses: github/codeql-action/analyze@v3
