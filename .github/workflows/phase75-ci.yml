name: Phase 75 CI
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm run typecheck
      - run: npm run test:phase69
      - run: npm run test:phase71
      - run: npm run test:phase73
      - run: npm run test:phase75
      - run: npx expo export --platform web
