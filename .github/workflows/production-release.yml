name: Production release validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm run typecheck
      - run: npm run test:rc12
      - run: npm run deploy:render:validate
      - run: npm run deploy:step3:validate
      - run: npm run build:web
        env:
          EXPO_PUBLIC_API_URL: https://api.yaposan.com
      - name: Upload web build evidence
        uses: actions/upload-artifact@v4
        with:
          name: yaposan-web-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14
