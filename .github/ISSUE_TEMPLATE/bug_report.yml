name: Bug report
description: Report a reproducible Yaposan problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Give the smallest reliable reproduction.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / platform
      placeholder: Firefox 141 on Windows 11
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove secrets, tokens, private data, and customer data before posting.
