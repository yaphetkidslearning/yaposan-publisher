services:
  background-removal:
    build:
      context: ./services/background-removal
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      PORT: "8090"
      YAPOSAN_BG_STANDARD_MODEL: ${YAPOSAN_BG_STANDARD_MODEL:-birefnet-general-lite}
      YAPOSAN_BG_DETAIL_MODEL: ${YAPOSAN_BG_DETAIL_MODEL:-birefnet-general}
      YAPOSAN_BG_PEOPLE_MODEL: ${YAPOSAN_BG_PEOPLE_MODEL:-birefnet-portrait}
      YAPOSAN_BG_PRODUCT_MODEL: ${YAPOSAN_BG_PRODUCT_MODEL:-birefnet-general}
      YAPOSAN_BG_MATTING_MODEL: ${YAPOSAN_BG_MATTING_MODEL:-birefnet-general}
      YAPOSAN_BG_FINE_DETAIL_MODEL: ${YAPOSAN_BG_FINE_DETAIL_MODEL:-birefnet-general}
      YAPOSAN_BG_MAX_BYTES: ${YAPOSAN_BG_MAX_BYTES:-50000000}
      YAPOSAN_BG_MAX_PIXELS: ${YAPOSAN_BG_MAX_PIXELS:-50000000}
      YAPOSAN_BG_MAX_CONCURRENCY: ${YAPOSAN_BG_MAX_CONCURRENCY:-2}
      YAPOSAN_BG_MODEL_VERSION: ${YAPOSAN_BG_MODEL_VERSION:-yaposan-94-birefnet-routing}
      YAPOSAN_BG_PHASE2_DATA_DIR: /data/phase2
      YAPOSAN_BG_DEPLOYMENT_ENV: ${YAPOSAN_BG_DEPLOYMENT_ENV:-development}
      YAPOSAN_BG_PHASE2_SERVICE_TOKEN: ${YAPOSAN_BG_PHASE2_SERVICE_TOKEN:-}
      YAPOSAN_BG_PHASE2_REQUIRE_SERVICE_AUTH: ${YAPOSAN_BG_PHASE2_REQUIRE_SERVICE_AUTH:-false}
      YAPOSAN_BG_PHASE2_STORAGE_ENCRYPTED: ${YAPOSAN_BG_PHASE2_STORAGE_ENCRYPTED:-false}
      YAPOSAN_BG_PHASE2_REQUIRE_ENCRYPTED_STORAGE: ${YAPOSAN_BG_PHASE2_REQUIRE_ENCRYPTED_STORAGE:-false}
      YAPOSAN_BG_CORRECTION_RATE_LIMIT_PER_MINUTE: ${YAPOSAN_BG_CORRECTION_RATE_LIMIT_PER_MINUTE:-60}
      YAPOSAN_BG_CORRECTION_MAX_STORED_EXAMPLES: ${YAPOSAN_BG_CORRECTION_MAX_STORED_EXAMPLES:-100000}
      YAPOSAN_BG_INFERENCE_QUEUE_TIMEOUT_SECONDS: ${YAPOSAN_BG_INFERENCE_QUEUE_TIMEOUT_SECONDS:-2}
      YAPOSAN_BG_INFRA_COST_USD_PER_HOUR: ${YAPOSAN_BG_INFRA_COST_USD_PER_HOUR:-0}
      YAPOSAN_BG_CANDIDATE_MODEL: ${YAPOSAN_BG_CANDIDATE_MODEL:-}
      YAPOSAN_BG_CANDIDATE_MODEL_VERSION: ${YAPOSAN_BG_CANDIDATE_MODEL_VERSION:-}
      YAPOSAN_BG_CANDIDATE_TRAFFIC_PERCENT: ${YAPOSAN_BG_CANDIDATE_TRAFFIC_PERCENT:-0}
      YAPOSAN_BG_CANDIDATE_SHADOW_MODE: ${YAPOSAN_BG_CANDIDATE_SHADOW_MODE:-true}
      YAPOSAN_BG_CANDIDATE_PRODUCTION_APPROVED: ${YAPOSAN_BG_CANDIDATE_PRODUCTION_APPROVED:-false}
    volumes:
      - yaposan-rembg-models:/root/.u2net
      - yaposan-bg-phase2:/data/phase2
    restart: unless-stopped

volumes:
  yaposan-rembg-models:
  yaposan-bg-phase2:
